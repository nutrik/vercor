[project]
name = "vercor"
version = "0.4.1"
authors = [
  { name = "Roman Nuterman" }
]
maintainers = [
  { name="Roman Nuterman", email="nuterman@nbi.ku.dk" },
]
description = "Versatile Earth-system coupler for atmosphere, ocean, sea-ice, and land components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"numpy>=2.2.6",
"scipy>=1.9.3",
"h5py>=3.11.0",
"h5netcdf>=1.4.1",
"xarray>=2025.1.2",
"matplotlib>=3.8.1",
"jax",
"jax-datetime",
"tree-math",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache-2.0",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
jcm = ["dinosaur==1.3.5", "jcm==1.1.1"]
veros = ["veros>=1.6.2,<1.7"]
test = [
  "PyYAML",
  "pytest>=7.4.0",
  "pytest-cov",
  "pytest-xdist>=3.7",
]
dev = [
  "black",
  "build",
  "flake8",
  "mypy",
  "PyYAML",
  "pytest>=7.4.0",
  "pytest-cov",
  "pytest-xdist>=3.7",
  "types-PyYAML",
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n4 --dist=loadscope --max-worker-restart=0"
filterwarnings = [
  "ignore:jax.experimental.shard_map is deprecated in v0.8.0. Used jax.shard_map instead\\.:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["vercor"]

[tool.coverage.report]
fail_under = 90

[tool.flake8]
exclude = [
  "vendor",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
