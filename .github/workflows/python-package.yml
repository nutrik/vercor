# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13",]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get jax-gcm
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        path: vendor/jax-gcm
        ref: v1.1.1 
    - name: Get Veros
      uses: actions/checkout@v4
      with:
        repository: team-ocean/veros
        path: vendor/veros
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install torch torchvision
        python -m pip install dinosaur==1.3.5
        pip install vendor/jax-gcm -r vendor/jax-gcm/requirements.txt
        pip install vendor/veros -r vendor/veros/requirements.txt
        pip install .
        export PYTHONPATH=./vendor/jax-gcm:./vendor/veros:$PYTHONPATH

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 120 chars wide
        flake8 . --count --exit-zero --max-line-length=120 --statistics
    - name: Type checking with mypy
      run: |
        pip install mypy
        pip install types-PyYAML
        mypy vercor tests examples
    - name: Test with pytest
      run: |
        pytest tests -q --ignore=vendor
